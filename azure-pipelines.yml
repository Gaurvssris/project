trigger:
- main

pool:
  name: Gau-Vik

stages:

# =========================
# STAGE 1 - TERRAFORM INIT
# =========================
- stage: Terraform_Init
  displayName: "Terraform Init"

  jobs:
  - job: Init
    displayName: "Terraform Init"

    steps:
    - task: TerraformTask@5
      displayName: "Terraform Init"
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/root/prod'
        backendServiceArm: 'Gau-Vik'
        backendAzureRmStorageAccountName: 'gauravsrivastava'
        backendAzureRmContainerName: 'gauravsrivastava'
        backendAzureRmKey: 'backup.tfstate'


# =========================
# STAGE 2 - TERRAFORM PLAN
# =========================
- stage: Terraform_Plan
  displayName: "Terraform Plan"

  dependsOn: Terraform_Init
  condition: succeeded()

  jobs:
  - job: Plan
    displayName: "Terraform Plan"

    steps:
    - task: TerraformTask@5
      displayName: "Terraform Init for Plan"
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/root/prod'
        backendServiceArm: 'Gau-Vik'
        backendAzureRmStorageAccountName: 'gauravsrivastava'
        backendAzureRmContainerName: 'gauravsrivastava'
        backendAzureRmKey: 'backup.tfstate'

    - task: TerraformTask@5
      displayName: "Terraform Plan"
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/root/prod'
        environmentServiceNameAzureRM: 'Gau-Vik'


# =========================
# STAGE 3 - TERRAFORM APPLY
# =========================
- stage: Terraform_Apply
  displayName: "Terraform Apply"

  dependsOn: Terraform_Plan
  condition: succeeded()

  jobs:
  - deployment: Apply
    displayName: "Terraform Apply"
    environment: 'Production'

    strategy:
      runOnce:
        deploy:
          steps:

          - task: TerraformTask@5
            displayName: "Terraform Init for Apply"
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/root/prod'
              backendServiceArm: 'Gau-Vik'
              backendAzureRmStorageAccountName: 'gauravsrivastava'
              backendAzureRmContainerName: 'gauravsrivastava'
              backendAzureRmKey: 'backup.tfstate'

          - task: TerraformTask@5
            displayName: "Terraform Apply"
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(System.DefaultWorkingDirectory)/root/prod'
              environmentServiceNameAzureRM: 'Gau-Vik'
              commandOptions: '-auto-approve'
